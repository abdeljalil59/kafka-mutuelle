# Source de données Prometheus de Grafana (phase 6, étape 4), provisionnée au démarrage depuis
# /etc/grafana/provisioning/datasources. L'uid est fixe : le dashboard s'y réfère (kafka-mutuelle.json).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Nom du service du compose, sur le réseau Docker interne (pas host.docker.internal : Prometheus est un conteneur).
    url: http://prometheus:9090
    isDefault: true
    editable: false
