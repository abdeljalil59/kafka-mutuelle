services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Les schémas sont stockés dans le topic _schemas du broker : pas de volume propre.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.11
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8082:8081"      # 8081 de l'hôte est pris par cotisation-service
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1   # un seul broker (défaut : 3)
    depends_on:
      - kafka

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      - kafka

  # Scrape /actuator/prometheus des deux services, qui tournent sur l'hôte : voir prometheus/prometheus.yml.
  # La configuration est à la racine du dépôt et le compose dans infra/ : d'où le « ../ » du montage (lecture seule).
  # Pas de volume pour les données : l'historique des métriques est perdu si le conteneur est recréé.
  # depends_on: kafka demandé pour démarrer après le broker ; Prometheus ne scrape pas le broker (il n'en dépend pas).
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kafka

  # Datasource et dashboard provisionnés depuis grafana/ (racine du dépôt, d'où le « ../ » : le compose est dans infra/).
  # Mot de passe « admin » et accès anonyme en lecture : démonstration locale uniquement (le port est publié sur toutes
  # les interfaces de la machine). GF_SECURITY_ADMIN_PASSWORD n'est lu qu'au premier démarrage (doc Grafana : « Set once
  # on first-run »). Pas de volume : la configuration vient des fichiers provisionnés, rien d'autre n'est à conserver.
  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  # Base cible du connecteur JDBC Sink (voir connect/ et docs/kafka-connect.md).
  # Port 5433 sur l'hôte : 5432 peut être pris par une installation locale. Pas de volume : base de démonstration jetable.
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: kafka_connect_sink
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka

  # Kafka Connect (mode distribué, un worker). Le plugin JDBC est installé au démarrage du conteneur : accès réseau requis.
  # Le broker est joint sur le listener interne kafka:19092 (9092 n'est annoncé que comme localhost:9092, pour l'hôte).
  # Replication factor 1 sur les trois topics internes (un seul broker, défaut : 3).
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.9.11
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "8085:8083"      # API REST de Connect ; 8083 de l'hôte est pris par prelevement-service
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-mutuelle-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      # 8081 : port du conteneur (8082 n'est que le port publié sur l'hôte, injoignable depuis le réseau Docker)
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    # Installation du plugin puis lancement normal du worker (commande d'origine de l'image).
    command:
      - bash
      - -c
      - confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:10.8.8 && /etc/confluent/docker/run
    depends_on:
      - kafka
      - schema-registry
      - postgres

volumes:
  kafka-data:
    name: kafka-mutuelle-data
