spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: prelevement-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: io.github.abdeljalil59.mutuelle.events.CotisationEmise
        spring.json.use.type.headers: false
    listener:
      concurrency: 1

prelevement:
  plafond: 100.00
  kafka:
    topic: cotisations.emises
    retry-demo:
      actif: false          # true : démarre le listener de démonstration @RetryableTopic
      topic: cotisations.retry-demo
      group-id: retry-demo-group
