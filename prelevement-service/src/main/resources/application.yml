spring:
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      # Schema Registry du compose (port hôte 8082). Au niveau global : lu par le consommateur et par le
      # producteur du topic de rejets (KafkaAvroSerializer dans ErreursKafkaConfig).
      schema.registry.url: http://localhost:8082
    consumer:
      group-id: prelevement-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer conservé autour du désérialiseur Avro : un message illisible part au topic
      # de rejets au lieu de bloquer la partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    listener:
      concurrency: 1
  # Oracle Free 23ai local (port 1522, service freepdb1) par défaut. Le service ne démarre pas sans base.
  # URL, utilisateur et mot de passe se surchargent par les variables d'environnement PRELEVEMENT_DB_URL,
  # PRELEVEMENT_DB_USER et PRELEVEMENT_DB_PASSWORD (les valeurs par défaut sont celles du développement local).
  datasource:
    url: ${PRELEVEMENT_DB_URL:jdbc:oracle:thin:@localhost:1522/freepdb1}
    username: ${PRELEVEMENT_DB_USER:kafka_mutuelle}
    password: ${PRELEVEMENT_DB_PASSWORD:kafka_mutuelle}
    driver-class-name: oracle.jdbc.OracleDriver
  sql:
    init:
      # Oracle n'est pas une base embarquée : sans "always", schema.sql ne serait pas appliqué.
      mode: always

# Port web du service, uniquement pour Actuator (aucune API) : 8080 est occupé par Kafka UI (compose), 8081 par
# cotisation-service, 8082 par le Schema Registry. Surchargeable par PRELEVEMENT_SERVER_PORT.
server:
  port: ${PRELEVEMENT_SERVER_PORT:8083}

# Seul health est exposé par défaut en HTTP : metrics (consultation) et prometheus (scrape) sont ajoutés.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# Réessais de la consommation avant l'envoi au topic de rejets (DefaultErrorHandler, ExponentialBackOffWithMaxRetries) :
# 4 réessais à 1 s, 2 s, 4 s puis 8 s, soit 5 livraisons et 15 s au plus. initial-interval en millisecondes.
# Une PrelevementInvalideException et un message illisible ne sont jamais réessayés (1 livraison).
kafka:
  error-handler:
    initial-interval: 1000
    multiplier: 2.0
    max-retries: 4

prelevement:
  plafond: 100.00
  kafka:
    topic: cotisations.emises
    # Résultat de chaque prélèvement (clé idAdherent), créé par le service au démarrage comme cotisations.emises.
    resultats:
      topic: prelevements.resultats
      delai-publication-ms: 10000   # attente de la confirmation du broker, comme cotisation-service
    retry-demo:
      actif: false          # true : démarre le listener de démonstration @RetryableTopic
      topic: cotisations.retry-demo
      group-id: retry-demo-group
